<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melo Vault</title>
<meta name="description" content="ดาวน์โหลด Melo Vault · ดูบอร์ดอันดับและโปรไฟล์ผู้ใช้">
<meta name="theme-color" content="#062A6B">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%230068B5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#062A6B; --navy-2:#0A3A8C; --blue:#0068B5; --cyan:#00C7FD; --violet:#6E5BFF; --gold:#FFB020;
  --paper:#F2F6FC; --card:#FFFFFF; --ink:#0C1B33; --ink-2:#4A5A75; --line:#DCE5F2;
  --side:252px; --r-lg:22px; --r-md:14px; --r-sm:10px;
  --display:"Bai Jamjuree", "IBM Plex Sans Thai", system-ui, sans-serif;
  --body:"IBM Plex Sans Thai", system-ui, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.65 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:6px}
img{display:block}

/* ---------- โครงหน้า: แถบข้าง (คอม) / แถบบน + เมนูแฮมเบอร์เกอร์ (มือถือ) ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:22px 16px;z-index:30}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;padding:4px 8px 22px}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font:700 21px/1 var(--display);letter-spacing:.2px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;color:#C9D8F2;font-weight:500}
.nav a svg{width:20px;height:20px;flex:none;opacity:.9}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a[aria-current="page"]{background:linear-gradient(90deg,rgba(0,199,253,.22),rgba(110,91,255,.12));color:#fff}
.side-foot{margin-top:auto;padding:14px 10px 4px;font-size:13px;color:#8FA6CF}
.side-dl{display:block;text-align:center;margin:0 0 14px;padding:12px;border-radius:14px;background:var(--cyan);color:var(--navy);text-decoration:none;font:700 15px/1.2 var(--display)}
.top{display:none}
.scrim{display:none}
main{margin-left:var(--side);min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:32px 36px 64px}

@media (max-width: 900px){
  .side{transform:translateX(-102%);transition:transform .25s ease;width:280px;box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.menu .side{transform:none}
  body.menu .scrim{display:block;position:fixed;inset:0;background:rgba(6,20,50,.45);z-index:25}
  .top{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--navy);color:#fff}
  .top .brand{padding:0}
  .top .brand b{font-size:18px}
  .burger{width:42px;height:42px;border:0;background:rgba(255,255,255,.08);border-radius:12px;display:grid;place-items:center;cursor:pointer}
  .burger svg{width:22px;height:22px}
  main{margin-left:0}
  .wrap{padding:20px 16px 48px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

/* ---------- ตัวอักษร ---------- */
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0}
h2{font-size:26px;font-weight:700;margin-bottom:14px}
.muted{color:var(--ink-2)}

/* ---------- หน้าแรก: ฮีโร่ ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;color:#fff;padding:44px 44px 0;
  background:radial-gradient(120% 90% at 85% 0%,rgba(0,199,253,.45),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(110,91,255,.55),transparent 60%),linear-gradient(160deg,var(--navy-2),var(--navy) 70%)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:end;position:relative;z-index:1}
.hero h1{font-size:clamp(44px,7vw,84px);font-weight:700;letter-spacing:-1px;line-height:.95}
.hero .ver{display:inline-flex;align-items:center;gap:8px;margin:18px 0 6px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);font-weight:600;font-size:15px}
.hero .ver i{width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(0,199,253,.25)}
.hero p.lead{font-size:18px;color:#D6E3FA;max-width:30em;margin:12px 0 26px}
.dl{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:12px;padding:14px 20px 14px 16px;border-radius:16px;text-decoration:none;border:0;cursor:pointer;font:600 16px/1.2 var(--display);transition:transform .15s ease, box-shadow .15s ease}
.btn svg{width:28px;height:28px;flex:none}
.btn small{display:block;font:500 12px/1.3 var(--body);opacity:.8}
.btn-android{background:#fff;color:var(--navy);box-shadow:0 10px 30px rgba(0,0,0,.18)}
.btn-android:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(0,0,0,.24)}
.btn-ios{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-ios[aria-disabled="true"]{cursor:default;opacity:.75}
.btn-ios:not([aria-disabled="true"]):hover{background:rgba(255,255,255,.18)}
.users{background:rgba(6,20,60,.35);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:22px 24px;margin-bottom:34px;backdrop-filter:blur(6px)}
.users .n{font:700 clamp(40px,5vw,58px)/1 var(--display);letter-spacing:-1px}
.users .l{color:#C9D8F2;margin-top:6px}
.users .row{display:flex;gap:22px;margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14)}
.users .row b{display:block;font:700 22px/1.1 var(--display)}
.users .row span{font-size:13px;color:#AFC3E6}
/* บันไดแรงค์ 34 ขั้น = คลื่นเสียง */
.ladder{position:relative;z-index:1;display:flex;align-items:flex-end;gap:5px;height:120px;margin-top:30px}
.ladder span{flex:1;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--c1),var(--c2));transform-origin:bottom;animation:rise .9s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i) * 22ms)}
@keyframes rise{from{transform:scaleY(.04)}to{transform:scaleY(1)}}

/* ---------- ส่วนอื่นของหน้าแรก ---------- */
.home-cols{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;margin-top:28px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.panel-h h2{margin:0;font-size:21px}
.panel-h a{font-weight:600;color:var(--blue);text-decoration:none;font-size:15px}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.feat li{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start}
.feat .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff}
.feat b{font-family:var(--display);font-size:17px;display:block}
.feat span{color:var(--ink-2);font-size:14.5px}
.steps{margin:0;padding-left:20px;color:var(--ink-2);font-size:14.5px}
.steps li{margin:4px 0}

/* ---------- แถวผู้ใช้ ---------- */
.rows{display:flex;flex-direction:column}
.urow{display:grid;grid-template-columns:38px 44px 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-radius:12px;text-decoration:none}
.urow:hover{background:#EEF4FD}
.urow + .urow{border-top:1px solid #EEF2F8}
.pos{font:700 17px/1 var(--display);color:var(--ink-2);text-align:center}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--blue),var(--violet));color:#fff;display:grid;place-items:center;font:700 18px/1 var(--display);flex:none;overflow:hidden}
.who{min-width:0}
.who > b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.who > span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font:700 17px/1 var(--display);text-align:right}
.val small{display:block;font:500 12px/1.4 var(--body);color:var(--ink-2)}
.tier{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#E8F0FD;color:var(--blue)}
.vip{display:inline-block;margin-left:6px;padding:0 6px;border-radius:6px;font-size:11px;font-weight:700;background:var(--gold);color:#3A2600;vertical-align:2px}

/* ---------- บอร์ด ---------- */
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;scrollbar-width:none}
.tabs a{flex:none;padding:9px 16px;border-radius:999px;text-decoration:none;font-weight:600;background:var(--card);border:1px solid var(--line);color:var(--ink-2)}
.tabs a[aria-current="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end;margin-bottom:18px}
.pod{text-decoration:none;text-align:center;border-radius:20px;padding:18px 12px 16px;color:#fff;position:relative}
.pod .av{width:64px;height:64px;margin:0 auto 10px;border:3px solid rgba(255,255,255,.85);font-size:24px}
.pod b{display:block;font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .v{font:700 22px/1.2 var(--display)}
.pod .p{position:absolute;top:10px;left:14px;font:700 26px/1 var(--display);opacity:.55}
.pod.p1{background:linear-gradient(160deg,#FFC24D,#F08A00);padding-top:30px}
.pod.p1 .av{width:80px;height:80px}
.pod.p2{background:linear-gradient(160deg,var(--blue),var(--navy-2))}
.pod.p3{background:linear-gradient(160deg,var(--violet),#3F2FB8)}

/* ---------- โปรไฟล์ ---------- */
.cover{height:210px;border-radius:24px;background:linear-gradient(135deg,var(--navy-2),var(--violet));background-size:cover;background-position:center;position:relative}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,transparent 40%,rgba(6,20,60,.45))}
.phead{display:flex;gap:20px;align-items:flex-start;margin:-58px 0 0 28px;position:relative;z-index:1;flex-wrap:wrap}
.phead .av{width:120px;height:120px;border:5px solid var(--paper);font-size:44px}
.phead h1{font-size:34px}
.phead > div{padding-top:66px;min-width:0}
.phead .handle{color:var(--ink-2)}
.title-chip{display:inline-block;margin-top:6px;padding:3px 12px;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--violet));color:#fff;font-size:13px;font-weight:600}
.bio{margin:18px 0 0;max-width:60ch;white-space:pre-wrap}
.pgrid{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;margin-top:24px}
.rankcard{border-radius:var(--r-lg);padding:22px;color:#fff;background:radial-gradient(100% 120% at 100% 0%,rgba(0,199,253,.4),transparent 60%),linear-gradient(150deg,var(--navy-2),var(--navy))}
.rankcard .rn{font:700 38px/1 var(--display);margin:6px 0 4px}
.bar{height:10px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin:16px 0 8px}
.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--violet))}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
.stat b{display:block;font:700 26px/1.1 var(--display)}
.stat span{color:var(--ink-2);font-size:14px}
.days{display:flex;align-items:flex-end;gap:6px;height:130px;margin-top:8px}
.days div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.days i{width:100%;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--cyan),var(--blue));min-height:3px}
.days span{font-size:11px;color:var(--ink-2)}

/* ---------- ค้นหา / ระดับ ---------- */
.search{display:flex;gap:10px;margin-bottom:18px}
.search input{flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);font:inherit;color:var(--ink)}
.search input:focus{outline:3px solid rgba(0,199,253,.5);border-color:var(--cyan)}
.search button{padding:0 22px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:600 16px/1 var(--display);cursor:pointer}
.tiers{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tierbox{border-radius:var(--r-md);padding:14px 16px;color:#fff}
.tierbox b{display:block;font:700 19px/1.2 var(--display)}
.tierbox span{font-size:13px;opacity:.85}

.empty,.err{padding:36px 10px;text-align:center;color:var(--ink-2)}
.skel{height:56px;border-radius:12px;background:linear-gradient(90deg,#E7EEF8,#F3F7FD,#E7EEF8);background-size:200% 100%;animation:sh 1.2s linear infinite;margin:6px 0}
@keyframes sh{to{background-position:-200% 0}}
.foot{margin-top:40px;color:var(--ink-2);font-size:13px}

@media (max-width: 900px){
  .hero{padding:28px 20px 0;border-radius:22px}
  .hero-grid{grid-template-columns:1fr;gap:6px}
  .users{margin-bottom:6px}
  .ladder{height:76px;gap:3px;margin-top:22px}
  .home-cols,.pgrid{grid-template-columns:1fr}
  .podium{gap:8px}
  .pod{padding:14px 6px 12px}
  .pod .av{width:48px;height:48px;font-size:18px}
  .pod.p1 .av{width:60px;height:60px}
  .pod b{font-size:14px}
  .pod .v{font-size:17px}
  .cover{height:150px;border-radius:18px}
  .phead{margin:-46px 0 0 14px;gap:12px}
  .phead > div{padding-top:52px}
  .phead .av{width:92px;height:92px;font-size:34px}
  .phead h1{font-size:26px}
  .btn{flex:1 1 220px}
  .urow{grid-template-columns:30px 40px 1fr auto;gap:10px}
  .av{width:40px;height:40px}
}
</style>
</head>

<header class="top">
  <button class="burger" id="burger" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="side">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <a class="brand" href="#/"><svg><use href="#logo"/></svg><b>Melo Vault</b></a>
</header>
<div class="scrim" id="scrim"></div>

<aside class="side" id="side" aria-label="เมนู">
  <a class="brand" href="#/"><svg style="color:var(--cyan)"><use href="#logo"/></svg><b>Melo Vault</b></a>
  <nav class="nav">
    <a href="#/" data-r="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>ดาวน์โหลด</a>

<script>
// ---------- ตั้งค่า (publishable key ใส่หน้าเว็บได้ ทุกตารางเปิด RLS) ----------
const SUPA = "https://dgsuvratzjyuixjkrqsm.supabase.co";
const KEY = "sb_publishable_y1srOJqCWGsaU0mpoc_TKQ_UBNUJ6Pp";
const DL = os => `${SUPA}/functions/v1/melo-web/download?os=${os}`;

// ต้องตรงกับ Ranks ในแอป
const RANKS = [["Silent",0],["Hum",60],["Whisper",180],["Murmur",400],["Echo",800],["Tap",1500],["Pulse",2500],["Rhythm",4000],["Groove",6500],["Melody",10000],["Harmony",15000],["Chorus",22000],["Anthem",32000],["Symphony",45000],["Crescendo",65000],["Virtuoso",95000],["Maestro",140000],["Encore",200000],["Legend",300000],["Luminous",370000],["Resonance",450000],["Radiance",560000],["Aurora",700000],["Nova",840000],["Infinity",1000000],["Stardust",1250000],["Cosmos",1600000],["Nebula",2000000],["Celestial",2500000],["Galaxy",3200000],["Mythic",4000000],["Immortal",5500000],["Transcendent",7500000],["Eternal Sound",10000000]];
const STAR = 500000;
function rankOf(p){
  p = Number(p)||0; let i = 0;
  RANKS.forEach((r,k)=>{ if (p >= r[1]) i = k; });
  const [name,min] = RANKS[i], next = RANKS[i+1];
  const span = (next ? next[1] : min*1.5+1) - min;
  const within = Math.min(Math.max((p-min)/span,0),.9999);
  const stars = p < RANKS.at(-1)[1] ? 0 : Math.floor((p-RANKS.at(-1)[1])/STAR)+1;
  return { level:i+1, name, sub:Math.min(3,Math.floor(within*3)+1), next:next?.[0], nextAt:next?.[1],
    progress: next ? within : ((p-min)%STAR)/STAR, stars };
}
// สีตามระดับ: ฟ้า → ม่วง → ทอง
function tierColor(level, alpha=1){
  const t = (level-1)/(RANKS.length-1);
  const stops = [[0,[0,199,253]],[.45,[0,104,181]],[.75,[110,91,255]],[1,[255,176,32]]];
  let a = stops[0], b = stops.at(-1);
  for (let k=0;k<stops.length-1;k++) if (t>=stops[k][0] && t<=stops[k+1][0]) { a=stops[k]; b=stops[k+1]; }
  const f = (t-a[0])/((b[0]-a[0])||1);
  return `rgba(${a[1].map((v,j)=>Math.round(v+(b[1][j]-v)*f)).join(",")},${alpha})`;
}

// ---------- ข้อมูล ----------
async function rpc(fn, args={}){
  const r = await fetch(`${SUPA}/rest/v1/rpc/${fn}`, { method:"POST",
    headers:{ apikey:KEY, authorization:`Bearer ${KEY}`, "content-type":"application/json" }, body:JSON.stringify(args) });
  if (!r.ok) throw new Error(`โหลดข้อมูลไม่ได้ (${r.status})`);
  return r.json();
}
let infoP = null;
function info(){
  infoP ??= fetch(`${SUPA}/functions/v1/melo-web/info`, { headers:{ apikey:KEY } }).then(r=>r.ok?r.json():{}).catch(()=>({}));
  return infoP;
}
function fileUrl(path, bucket="avatars"){
  if (!path) return null;
  if (path.startsWith("http")) return path;
  if (path.startsWith("sftp:")) return `${SUPA}/functions/v1/melo-files/f/${path.slice(5)}`;
  return `${SUPA}/storage/v1/object/public/${bucket}/${path}`;
}

// ---------- ตัวช่วยวาด ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = n => Number(n||0).toLocaleString("th-TH", { maximumFractionDigits: 0 });
function avatar(u){
  const url = fileUrl(u.avatar), ch = esc((u.name||"?").trim().charAt(0) || "?");
  return url ? `<img class="av" src="${esc(url)}" alt="" loading="lazy" onerror="this.outerHTML='<span class=&quot;av&quot;>${ch}</span>'">` : `<span class="av">${ch}</span>`;
}
function tierChip(points){ const r = rankOf(points); return `<span class="tier" style="background:${tierColor(r.level,.14)};color:${tierColor(r.level)}">${esc(r.name)} ${"I".repeat(r.sub)}</span>`; }
function userHref(u){ return u.username ? `#/u/${encodeURIComponent(u.username)}` : null; }
const $ = s => document.querySelector(s);
const view = $("#view");
function skel(n=6){ return Array.from({length:n},()=>'<div class="skel"></div>').join(""); }

// ---------- หน้า ----------
const ORDERS = [["rank","แรงค์"],["today","วันนี้"],["minutes","เวลาฟังรวม"],["credits","เครดิต"],["streak","ต่อเนื่อง"]];
function valueText(o, v){
  if (o === "rank") return { v: num(v), s: "แต้ม" };
  if (o === "credits") return { v: num(v), s: "เครดิต" };
  if (o === "streak") return { v: num(v), s: "วัน" };
  return { v: num(v), s: "นาที" };
}

  document.title = "ระดับแรงค์ — Melo Vault";
  view.innerHTML = `<h2>ระดับแรงค์</h2><p class="muted" style="margin-top:-6px">34 ขั้น แต่ละขั้นแบ่งเป็น I · II · III เลยขั้นสุดท้ายแล้วได้ดาวทุก ๆ ${num(STAR)} แต้ม</p>
    <div class="tiers">${RANKS.map((r,i)=>`<div class="tierbox" style="background:linear-gradient(150deg,${tierColor(i+1)},${tierColor(Math.max(1,i-4))})"><span>ขั้น ${i+1}</span><b>${esc(r[0])}</b><span>${num(r[1])} แต้มขึ้นไป</span></div>`).join("")}</div>`;
}

// ---------- เส้นทาง ----------
function route(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/,""));
  const [a, ...rest] = h.split("/");
  const b = rest.join("/");
  document.body.classList.remove("menu"); $("#burger").setAttribute("aria-expanded","false");
  const key = a === "u" ? "board" : (a || "home");
  document.querySelectorAll(".nav a").forEach(x => x.toggleAttribute("aria-current", false) || (x.dataset.r === key && x.setAttribute("aria-current","page")));
  window.scrollTo(0,0);
  if (a === "board") return pageBoard(b || "rank");
  if (a === "u" && b) return pageProfile(b);
  if (a === "search") return pageSearch(b);
  if (a === "ranks") return pageRanks();
  return pageHome();
}
window.addEventListener("hashchange", route);
$("#burger").addEventListener("click", () => { const on = document.body.classList.toggle("menu"); $("#burger").setAttribute("aria-expanded", on); });
$("#scrim").addEventListener("click", () => document.body.classList.remove("menu"));
document.addEventListener("keydown", e => { if (e.key === "Escape") document.body.classList.remove("menu"); });
document.querySelectorAll("[data-dl-android]").forEach(a => a.href = DL("android"));
info().then(d => { const v = d.version || d.android?.version; if (v) $("#sideVer").textContent = `Melo Vault ${v}`; });
route();
</script>
</body>
</html>
